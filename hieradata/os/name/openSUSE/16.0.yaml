# hieradata/os/name/openSUSE/16.0.yaml

pocketprotector::monitoring::librenms::repositories:
  devel-languages-php:
    enabled: 1
    autorefresh: 1
    baseurl: https://download.opensuse.org/repositories/devel:languages:php/$releasever/
    type: NONE
    keeppackages: 0
    gpgcheck: 1
    gpgkey: https://download.opensuse.org/repositories/devel:/languages:/php/$releasever/repodata/repomd.xml.key

pocketprotector::puppet::puppetdb::database::version: '14'
pocketprotector::puppet::server::puppetboard::python_version: '3.13'

puppetboard::python_version: '3.13'

python::manage_pip_package: false
python::version: 'python3'
python::valid_versions: 'python3'
python::pip::bootstrap::version: pip3
python::pip::bootstrap::manage_python: false

